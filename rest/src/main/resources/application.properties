spring.application.name=foodrescue-ai

# Local secrets (e.g. GEMINI_API_KEY) - see .env.example; never committed.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/foodrescue
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

app.security.jwt.secret=${JWT_SECRET:change-this-secret-to-a-random-32-byte-value}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.forecast.provider=${FORECAST_PROVIDER:gemini}
app.forecast.closing-time=${FORECAST_CLOSING_TIME:22:00}
app.forecast.min-sales=${FORECAST_MIN_SALES:5}
app.forecast.lookback-weeks=${FORECAST_LOOKBACK_WEEKS:4}

app.waste-risk.threshold=${WASTE_RISK_THRESHOLD:70}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:15}
