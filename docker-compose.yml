services:
  db:
    image: postgres:16-alpine
    container_name: foodrescue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodrescue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - foodrescue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodrescue"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: foodrescue-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/foodrescue
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  foodrescue-db-data:
