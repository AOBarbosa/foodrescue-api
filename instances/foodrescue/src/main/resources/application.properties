spring.application.name=foodrescue

# Local secrets (e.g. GEMINI_API_KEY) - see .env.example; never committed.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/foodrescue
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/foodrescue-master.xml

app.security.jwt.secret=${JWT_SECRET:change-this-secret-to-a-random-32-byte-value}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.forecast.provider=${FORECAST_PROVIDER:gemini}
app.forecast.min-sales=${FORECAST_MIN_SALES:5}
app.forecast.lookback-weeks=${FORECAST_LOOKBACK_WEEKS:4}

app.waste-risk.threshold=${WASTE_RISK_THRESHOLD:70}

app.discount.risk-factor=${DISCOUNT_RISK_FACTOR:0.6}
app.discount.urgency-bonus=${DISCOUNT_URGENCY_BONUS:15}
# remaining time, in the forecast window's unit (hours here), that makes a discount urgent
app.discount.urgent-remaining=${DISCOUNT_URGENT_HOURS:4}
app.discount.max-percentage=${DISCOUNT_MAX_PERCENTAGE:60}
app.discount.recommendation-ttl-hours=${DISCOUNT_RECOMMENDATION_TTL_HOURS:24}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:15}

app.surplus.discount-step=${SURPLUS_DISCOUNT_STEP:10}
# how close to the end of the forecast window (hours here) a persisting risk is reassessed
app.surplus.window=${SURPLUS_WINDOW_HOURS:3}
app.surplus.cooldown-minutes=${SURPLUS_COOLDOWN_MINUTES:60}
app.surplus.reassessment-interval-ms=${SURPLUS_REASSESSMENT_INTERVAL_MS:900000}

# --- PerishRescue kernel ---
# Pricing (hot spot 2) is FoodItemPricingPolicy; these bound it and set the repricing period.
perishrescue.pricing.max-discount=${PRICING_MAX_DISCOUNT:90}
perishrescue.pricing.repricing-interval-ms=${PRICING_REPRICING_INTERVAL_MS:300000}
# Reservations wait this long for the in-person pickup before expiring.
perishrescue.reservation.pickup-tolerance-minutes=${RESERVATION_PICKUP_TOLERANCE_MINUTES:120}
perishrescue.lifecycle.check-interval-ms=${LIFECYCLE_CHECK_INTERVAL_MS:60000}
# Forecast (hot spot 4): the framework's default horizon forecasts until each item's
# critical deadline (for a FoodItem, the offerer's closing time today), counted in hours.
perishrescue.forecast.granularity=HOURS
perishrescue.forecast.business-description=um pequeno estabelecimento de alimentos (padaria, restaurante ou mercado)
# Swagger UI
perishrescue.api.title=FoodRescue API
perishrescue.api.description=REST API for reducing food waste by connecting offerers' surplus to beneficiaries.
